<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

<style>
  /* ── Token system ── */
  :root {
    --bg:        oklch(97260);
    --accent-bg: oklch(95% 0.04  260);
    --radius-sm: 6px;
    --radius-md: 12px;
    --sp1: 4px; --sp2: 8px; --sp3: 16px; --sp4: 24px; --sp5: 40px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:        oklch(14% 0.01  250);
      --surface:   oklch(18% 0.012 250);
      --border:    oklch(28% 0.015 250);
      --muted:     oklch(62% 0.015 250);
      --body:      oklch(92% 0.01  250);
      --accent:    oklch(68% 0.16  260);
      --accent-bg: oklch(22% 0.06  260);
    }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Vazirmatn", "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--body);
    display: grid;
    grid-template-columns: 260px 1fr;
    min-height: 100vh;
  }

  /* ── Sidebar ── */
  #sidebar {
    background: var(--surface);
    border-left: 1px solid var(--border);
    padding: var(--sp4) var(--sp3);
    overflow-y: auto;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  #sidebar h1 {
    font-size: 1rem;
    font-weight: 700;
    color: var(--accent);
    margin-bottom: var(--sp4);
    padding-bottom: var(--sp2);
    border-bottom: 2px solid var(--accent);
  }
  .course-group { margin-bottom: var(--sp3); }
  .course-title {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: var(--sp2);
  }
  .chapter-title {
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--body);
    padding: var(--sp1) var(--sp2);
    margin-bottom: 2px;
  }
  .nav-link {
    display: block;
    font-size: 0.84rem;
    color: var(--body);
    text-decoration: none;
    padding: var(--sp1) var(--sp3);
    border-radius: var(--radius-sm);
    transition: background 150ms ease, color 150ms ease;
    margin-bottom: 2px;
  }
  .nav-link:hover  { background: var(--accent-bg); color: var(--accent); }
  .nav-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .nav-link.active { background: var(--accent-bg); color: var(--accent); font-weight: 600; }

  /* ── Main ── */
  #main {
    padding: var(--sp5) var(--sp5);
    max-width: 820px;
    width: 100%;
  }
  #content h1 { font-size: 1.7rem; margin-bottom: var(--sp4); }
  #content h2 { font-size: 1.3rem; margin: var(--sp4) 0 var(--sp2); border-bottom: 1px solid var(--border); padding-bottom: var(--sp2); }
  #content h3 { font-size: 1.1rem; margin: var(--sp3) 0 var(--sp2); }
  #content p  { line-height: 1.75; margin-bottom: var(--sp3); max-width: 68ch; }
  #content ul, #content ol { padding-right: var(--sp4); margin-bottom: var(--sp3); line-height: 1.75; }
  #content pre {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: var(--sp3);
    overflow-x: auto;
    margin-bottom: var(--sp3);
  }
  #content code { font-family: "Cascadia Code", monospace; font-size: 0.88em; }
  #content p code {
    background: var(--accent-bg);
    color: var(--accent);
    padding: 1px 5px;
    border-radius: 4px;
  }
  #content blockquote {
    border-right: 4px solid var(--accent);
    padding: var(--sp2) var(--sp3);
    background: var(--accent-bg);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    margin-bottom: var(--sp3);
    color: var(--muted);
  }
  #content table { border-collapse: collapse; width: 100%; margin-bottom: var(--sp3); }
  #content th, #content td { border: 1px solid var(--border); padding: var(--sp2) var(--sp3); text-align: right; }
  #content th { background: var(--accent-bg); font-weight: 600; }

  /* KaTeX display */
  .katex-display { overflow-x: auto; padding: var(--sp2) 0; }

  /* Loading / errodisplay { overflow-x: auto; padding: var(--sp2) 0; }

  /* Loading / error */
  #status {
    color: var(--muted);
    font-size: 0.9rem;
    : static; height: auto; border-left: none; border-bottom: 1px solid var(--border); }
    #main { padding: var(--sp4) var(--sp3); }
  }
</style>

<body>

<nav id="sidebar" aria-label="ناوبری دروس">
  <h1>📚 Zorya Journey</h1>
  <div id="nav-tree"><p style="color:var(--muted);font-size:.85rem">در حال بارگذاری...</p></div>
</nav>

<main id="main">
  <div id="content">
    <p id="status">یک جلسه را از منو انتخاب کنید.</p>
  </div>
</main>

<script>
// ── Config ──────────────────────────────────────────────────────────────────
const REPO_OWNER = 'zoryajourney-cmd';
const REPO_NAME  = 'zoryajourney.github.io';
const BRANCH     = 'main';

// ── Course / chapter map (نام فارسی از پیشوند فایل) ─────────────────────────
const COURSE_MAP = {
  phys1:  { name: 'فیزیک ۱',       chapters: { '': 'جلسات' } },
  phys2:  { name: 'فیزیک ۲',       chapters: {} },
  calc1:  { name: 'حساب ۱',        chapters: {} },
  calc2:  { name: 'حساب ۲',        chapters: {} },
  linalg: { name: 'جبر خطی',       chapters: {} },
  stat:   { name: 'آمار',           chapters: {} },
  alg:    { name: 'الگوریتم',       chapters: {} },
  cs:     { name: 'مبانی CS',       chapters: {} },
  // هر درس جدیدی اضافه کنی اینجا تعریف کن
};

// نام فایل → {course, chapter, session, label}
function parseName(filename) {
  // format: {course}-{chapterN}-session{N}.md  یا  {course}-session{N}.md
  const base = filename.replace(/\.md$/i, '');
  const m = base.match(/^([a-z]+\d*)(?:-([a-z]+\d*))?-session(\d+)$/i);
  if (!m) return null;
  const courseKey = m[1].toLowerCase();
  const chapterKey = m[2] ? m[2].toLowerCase() : '';
  const sessionNum = parseInt(m[3], 10);
  const courseInfo = COURSE_MAP[courseKey] || { name: courseKey, chapters: {} };
  const chapterName = courseInfo.chapters[chapterKey] || (chapterKey ? `فصل ${chapterKey}` : 'جلسات');
  return {
    courseKey,
    courseName: courseInfo.name,
    chapterKey,
    chapterName,
    sessionNum,
    label: `جلسه ${toPersianNum(sessionNum)}`,
    filename
  };
}

function toPersianNum(n) {
  return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
}

// ── Fetch file list from GitHub API ──────────────────────────────────────────
async function fetchFileList() {
  const url = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/git/trees/${BRANCH}?recursive=1`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`GitHub API: ${res.status}`);
  const data = await res.json();
  return data.tree
    .filter(f => f.type === 'blob' && f.path.endsWith('.md') && !f.path.includes('/'))
    .map(f => f.path);
}

// ── Fetch & render a markdown file ───────────────────────────────────────────
async function loadFile(filename) {
  const url = `https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/${filename}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`خطا در بارگذاری: ${filename}`);
  const text = await res.text();
  return text;
}

// ── Build sidebar tree ────────────────────────────────────────────────────────
function buildNav(files) {
  const parsed = files.map(parseName).filter(Boolean);
  // group: course → chapter → sessions[]
  const tree = {};
  for (const p of parsed) {
    if (!tree[p.courseKey]) tree[p.courseKey] = { name: p.courseName, chapters: {} };
    if (!tree[p.courseKey].chapters[p.chapterKey])
      tree[p.courseKey].chapters[p.chapterKey] = { name: p.chapterName, sessions: [] };
    tree[p.courseKey].chapters[p.chapterKey].sessions.push(p);
  }
  // sort sessions
  for (const c of Object.values(tree))
    for (const ch of Object.values(c.chapters))
      ch.sessions.sort((a, b) => a.sessionNum - b.sessionNum);

  const nav = document.getElementById('nav-tree');
  nav.innerHTML = '';
  for (const [ck, course] of Object.entries(tree)) {
    const group = document.createElement('div');
    group.className = 'course-group';
    group.innerHTML = `<div class="course-title">${course.name}</div>`;
    for (const [chk, chapter] of Object.entries(course.chapters)) {
      if (Object.keys(course.chapters).length > 1) {
        const ct = document.createElement('div');
        ct.className = 'chapter-title';
        ct.textContent = chapter.name;
        group.appendChild(ct);
      }
      for (const s of chapter.sessions) {
        const a = document.createElement('a');
        a.className = 'nav-link';
        a.href = '#';
        a.textContent = s.label;
        a.dataset.file = s.filename;
        a.addEventListener('click', e => { e.preventDefault(); openFile(s.filename); });
        group.appendChild(a);
      }
    }
    nav.appendChild(group);
  }
}

// ── Open and render a file ────────────────────────────────────────────────────
async function openFile(filename) {
  // update active state
  document.querySelectorAll('.nav-link').forEach(a => {
    a.classList.toggle('active', a.dataset.file === filename);
  });

  const content = document.getElementById('content');
  content.innerHTML = '<p id="status">در حال بارگذاری...</p>';

  try {
    const md = await loadFile(filename);
    content.innerHTML = marked.parse(md);
    // render math
    if (window.renderMathInElement) {
      renderMathInElement(content, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '$',  right: '$',  display: false }
        ],
        throwOnError: false
      });
    }
    // scroll to top
    document.getElementById('main').scrollT hash
    location.hash = encodeURIComponent(filename);
  } catch (er.hash = encodeURIComponent(filename);
  } catch (err) {
    content.innerHTML = `<p style="color:oklch(55% 0.18 25)">${err.message}</p>`;
  }
}

// ── Init ──────────────────────────────────────────────────────────────────────
(async () => {
  try {
    const files = await fetchFileList();
    buildNav(files);
    // open from hash if present
    const hash = decodeURIComponent(location.hash.slice(1));
    if (hash && files.includes(hash)) {
      openFile(hash);
    }
  } catch (err) {
    document.getElementById('nav-tree').innerHTML =
      `<p style="color:oklch(55% 0.18 25);font-size:.85rem">${err.message}</p>`;
  }
})();
</script>
</body>
