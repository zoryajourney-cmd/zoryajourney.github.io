const COURSES=[{"id": "phys1-session1", "title": "جلسه ۱: مفاهیم پایه، کمیت‌های نرده‌ای و برداری", "topics": "یکاها، اسکالر، برداری، دیمانسیون", "file": "phys1-session1.md", "markdown": "# جلسه 1\n**۱. نام درس:** فیزیک عمومی ۱  \n**۲. نام مبحث کلان:** بردارها – مفاهیم پایه و کمیت‌ها  \n**۳. شماره و عنوان جلسه:** جلسه ۱: یکاها، کمیت‌های اسکالر و برداری، دیمانسیون  \n**۴. برچسب‌ها (Tags):** واحدها, اسکالر, برداری, دیمانسیون, SI, مفاهیم پایه\n\n**۵. محتوای کامل جلسه (Markdown):**\n\n### پدیده واقعی – از زندگی روزمره شروع می‌کنیم\n\nفرض کن می‌خواهی به دوستت بگویی «میز من چقدر بزرگ است».  \nمی‌گویی: «طول میز ۲ متر است».  \n\nحالا فرض کن می‌خواهی بگویی ماشینت چقدر سریع حرکت می‌کند.  \nاگر فقط بگویی «۵۰» هیچ‌کس نمی‌فهمد. باید بگویی «۵۰ کیلومتر بر ساعت».  \nاما حتی این هم کافی نیست! چون مهم است که ماشین به کدام سمت می‌رود: شمال؟ جنوب؟ شرق؟  \n\nاینجا دو نوع حرف زدن مختلف داریم:\n- بعضی چیزها فقط با یک عدد کامل می‌شوند (مثل طول میز).\n- بعضی چیزها هم عدد می‌خواهند هم جهت (مثل سرعت ماشین).\n\nفیزیک دقیقاً همین تفاوت را جدی می‌گیرد.\n\n### تصویر ذهنی\n\nتصور کن روی میز دو تا چیز داری:\n\n1. یک لیوان آب.  \n   اگر بپرسی «چقدر آب داخلش است؟» جواب یک عدد است (مثلاً ۲۰۰ میلی‌لیتر). جهت مهم نیست. آب بالا یا پایین ندارد.\n\n2. یک تیر که از کمان پرتاب شده.  \n   اگر فقط بگویی «تیر با سرعت ۴۰ متر بر ثانیه رفت» ناقص است. باید بگویی به کدام سمت رفت. چون جهت کاملاً مهم است.\n\nاین دو مثال ساده، پایه تمام فصل ماست.\n\n### توضیح ساده و قدم‌به‌قدم\n\nدر فیزیک به هر چیزی که بتوانیم آن را اندازه بگیریم **کمیت فیزیکی** می‌گوییم.  \nبرای اندازه‌گیری هر کمیت، به یک **یکا** یا **واحد** نیاز داریم.\n\n**یکا چیست؟**  \nیکا مثل یک خط‌کش استاندارد است.  \nمثلاً برای طول، همه دنیا توافق کرده‌اند که «متر» را به‌عنوان واحد استاندارد استفاده کنند.  \nویژگی‌های یک یکای خوب:\n- ثابت باشد (تغییر نکند)\n- در دسترس باشد (همه بتوانند به آن دسترسی داشته باشند)\n- با دقت قابل اندازه‌گیری باشد\n\n### تعریف فیزیکی دقیق\n\n- **کمیت فیزیکی:** هر عددی که برای توصیف یک پدیده فیزیکی بیان شود.\n- **یکا (واحد):** مقدار معینی از آن کمیت که به‌عنوان مرجع انتخاب شده است.\n\n### کمیت‌های اصلی در سامانه بین‌المللی (SI)\n\nدر مکانیک سه کمیت اصلی داریم که بقیه از آن‌ها ساخته می‌شوند:\n\n| شماره | کمیت | واحد استاندارد | نماد |\n|-------|------|----------------|------|\n| ۱ | طول | متر | $m$ |\n| ۲ | جرم | کیلوگرم | $kg$ |\n| ۳ | زمان | ثانیه | $s$ |\n\nاین سه تا مثل آجرهای اصلی ساختمان هستند. بقیه کمیت‌ها از ترکیب این‌ها ساخته می‌شوند.\n\n### یکاهای فرعی (ترکیبی)\n\nوقتی این سه تا را با هم ترکیب کنیم، کمیت‌های جدید به وجود می‌آید:\n\n- **سرعت** = طول تقسیم بر زمان → $\\dfrac{m}{s}$\n- **شتاب** = سرعت تقسیم بر زمان → $\\dfrac{m}{s^2}$\n- **چگالی** = جرم تقسیم بر حجم → $\\dfrac{kg}{m^3}$\n- **نیرو** = جرم × شتاب → $\\dfrac{kg \\cdot m}{s^2}$ که به آن **نیوتون** ($N$) می‌گوییم.\n\n### دو نوع کمیت خیلی مهم\n\nاینجا مهم‌ترین تقسیم‌بندی فصل را یاد می‌گیریم:\n\n**۱. کمیت اسکالر (یا عددی)**  \nفقط اندازه دارد. جهت برایش بی‌معنی است.  \nمثال‌های روزمره:\n- جرم یک کتاب (۲ کیلوگرم)\n- حجم یک بطری آب (۱٫۵ لیتر)\n- دمای هوا (۲۵ درجه)\n- زمان یک مسابقه (۹٫۵۸ ثانیه)\n- انرژی مصرفی یخچال\n\n**۲. کمیت برداری**  \nهم اندازه دارد، هم جهت، هم راستا.  \nمثال‌های روزمره:\n- جابه‌جایی (من از خانه تا مدرسه ۵۰۰ متر به سمت شرق رفتم)\n- سرعت (ماشین با سرعت ۶۰ کیلومتر بر ساعت به سمت شمال می‌رود)\n- شتاب\n- نیرو (من کتاب را با نیروی ۱۰ نیوتون به سمت بالا بلند کردم)\n- تکانه\n\n> **نکته کلیدی خیلی مهم:**  \n> اگر کمیتی فقط با یک عدد کامل شود → اسکالر است.  \n> اگر علاوه بر عدد، حتماً باید جهت هم گفته شود → برداری است.\n\n### دیمانسیون چیست؟ (از صفر)\n\nدیمانسیون یعنی «ماهیت» یک کمیت را با سه حرف اصلی نشان دهیم:\n- $[M]$ برای جرم\n- $[L]$ برای طول\n- $[T]$ برای زمان\n\nمثال‌ها را قدم‌به‌قدم ببین:\n\n**جابه‌جایی ($x$):**  \nفقط طول است → $[x] = [L]$\n\n**سرعت ($v$):**  \nطول تقسیم بر زمان → $[v] = [L][T]^{-1}$\n\n**شتاب ($a$):**  \nسرعت تقسیم بر زمان → $[a] = [L][T]^{-2}$\n\n**نیرو ($F = ma$):**  \nجرم × شتاب → $[F] = [M][L][T]^{-2}$\n\n**فشار ($P = F/A$):**  \nنیرو تقسیم بر مساحت → $[P] = [M][L]^{-1}[T]^{-2}$\n\n### مثال حل‌شده ۱ – تبدیل واحد چگالی (از جزوه)\n\n**صورت مسئله:**  \nچگالی جسمی برابر $10\\,\\dfrac{Lb}{ft^3}$ است. این چگالی را بر حسب $\\dfrac{kg}{m^3}$ بنویسید.\n\n**قدم ۱ – داده‌های تبدیل را بنویس:**  \n$1\\,ft = 0.304\\,m$  \n$1\\,Lb = 0.453\\,kg$\n\n**قدم ۲ – واحدها را جایگزین کن:**  \n$$\n10\\,\\dfrac{Lb}{ft^3} = 10 \\times \\dfrac{0.453\\,kg}{(0.304\\,m)^3}\n$$\n\n**قدم ۳ – توان را حساب کن:**  \n$(0.304)^3 = 0.304 \\times 0.304 \\times 0.304 = 0.028117504$\n\n**قدم ۴ – تقسیم کن:**  \n$\\dfrac{0.453}{0.028117504} \\approx 16.11$\n\n**قدم ۵ – در ۱۰ ضرب کن:**  \n$10 \\times 16.11 = 161.1\\,\\dfrac{kg}{m^3}$\n\n> **بررسی فیزیکی:**  \n> فوت مکعب خیلی کوچک‌تر از متر مکعب است، پس وقتی به متر مکعب می‌رویم عدد باید بزرگ‌تر شود. جواب منطقی است.\n\n### هشدار دام تستی و مفهومی\n\n1. فراموش کردن توان ۳ در تبدیل حجم → خیلی رایج است.\n2. اشتباه گرفتن اسکالر و برداری (مثلاً گفتن «سرعت ماشین ۵۰ است» بدون گفتن جهت).\n3. واحدها را تبدیل نکردن قبل از جایگذاری در فرمول.\n\n### تمرین من (پلکانی)\n\n**سطح ۱ (تشخیص مفهوم):**  \nبگو کدام اسکالر است و کدام برداری:  \nالف) دمای بدن  \nب) نیروی باد  \nج) جرم یک سیب  \nد) سرعت باد\n\n**سطح ۲ (جایگذاری مستقیم):**  \nدیمانسیون انرژی جنبشی ($\\frac{1}{2}mv^2$) را پیدا کن.\n\n**سطح ۳ (تبدیل واحد):**  \nسرعت $72\\,\\dfrac{km}{h}$ را به $\\dfrac{m}{s}$ تبدیل کن.\n\n**سطح ۴ (ترکیبی):**  \nچگالی آب تقریباً $1000\\,\\dfrac{kg}{m^3}$ است. این مقدار را بر حسب $\\dfrac{g}{cm^3}$ بنویس.\n\n[نیاز به نمودار: جدول سه‌ستونه با عنوان «کمیت‌های اصلی SI» شامل ستون‌های نام کمیت، نماد دیمانسیون، واحد استاندارد + یک شکل ساده از پیکان سرعت با جهت]\n\n---\n"}, {"id": "phys1-session2", "title": "جلسه ۲: دستگاه‌های مختصات و تبدیل مختصات", "topics": "مختصات دکارتی، قطبی", "file": "phys1-session2.md", "markdown": "# جلسه 2\n**۱. نام درس:** فیزیک عمومی ۱  \n**۲. نام مبحث کلان:** بردارها – دستگاه‌های مختصات  \n**۳. شماره و عنوان جلسه:** جلسه ۲: دستگاه دکارتی و قطبی و تبدیل مختصات  \n**۴. برچسب‌ها (Tags):** مختصات دکارتی, مختصات قطبی, تبدیل مختصات, بردار یکه, زاویه\n\n**۵. محتوای کامل جلسه (Markdown):**\n\n### پدیده واقعی\n\nفرض کن دوستت از تو می‌پرسد: «کتابخانه‌ات کجاست؟»  \nدو جور می‌توانی جواب بدهی:\n\nروش اول:  \n«از در ورودی ۳ متر به راست برو، بعد ۴ متر به جلو.»\n\nروش دوم:  \n«از در ورودی ۵ متر با زاویه ۵۳ درجه نسبت به دیوار راست برو.»\n\nهر دو جواب درست هستند و به یک نقطه می‌رسند. فقط زبان توصیف فرق دارد.\n\nدر فیزیک هم دقیقاً همین دو زبان را داریم.\n\n### تصویر ذهنی\n\nصفحه کاغذ را مثل نقشه شهر تصور کن:\n- محور افقی ($x$) مثل خیابان شرقی-غربی\n- محور عمودی ($y$) مثل خیابان شمالی-جنوبی\n- مبدأ (نقطه صفر) مثل میدان اصلی شهر\n\n### توضیح ساده\n\n**دستگاه دکارتی (قائم):**  \nموقعیت هر نقطه را با دو عدد می‌گوییم: $(x, y)$  \nمثلاً نقطه $(3, 4)$ یعنی ۳ واحد راست و ۴ واحد بالا.\n\n**دستگاه قطبی:**  \nموقعیت را با یک فاصله و یک زاویه می‌گوییم: $(r, \\theta)$  \n$r$ = فاصله مستقیم از مبدأ  \n$\\theta$ = زاویه نسبت به محور مثبت $x$ (معمولاً خلاف عقربه‌های ساعت)\n\n### روابط تبدیل – قدم‌به‌قدم از صفر\n\nاز مثلثات ساده شروع می‌کنیم.\n\nدر مثلث قائم‌الزاویه:\n$$\n\\cos\\theta = \\dfrac{\\text{ضلع مجاور}}{\\text{وتر}} \\implies x = r\\cos\\theta\n$$\n$$\n\\sin\\theta = \\dfrac{\\text{ضلع مقابل}}{\\text{وتر}} \\implies y = r\\sin\\theta\n$$\n\nبرعکس:\n$$\nr = \\sqrt{x^2 + y^2}\n$$\n$$\n\\theta = \\tan^{-1}\\left(\\dfrac{y}{x}\\right)\n$$\n\n> **نکته خیلی خیلی مهم:**  \n> وقتی از فرمول $\\theta = \\tan^{-1}(y/x)$ استفاده می‌کنی، ماشین‌حساب فقط یک جواب بین $-90^\\circ$ تا $+90^\\circ$ می‌دهد.  \n> تو باید خودت ربع مختصاتی را چک کنی:\n> - ربع اول: $x>0$، $y>0$ → زاویه بین ۰ تا ۹۰\n> - ربع دوم: $x<0$، $y>0$ → زاویه بین ۹۰ تا ۱۸۰\n> - ربع سوم: $x<0$، $y<0$ → زاویه بین ۱۸۰ تا ۲۷۰\n> - ربع چهارم: $x>0$، $y<0$ → زاویه بین ۲۷۰ تا ۳۶۰ (یا منفی)\n\n### مثال حل‌شده ۱ – از دکارتی به قطبی\n\nنقطه $(x, y) = (4, 3)$ را به قطبی تبدیل کن.\n\n**قدم ۱:**  \n$$\nr = \\sqrt{4^2 + 3^2} = \\sqrt{16 + 9} = \\sqrt{25} = 5\n$$\n\n**قدم ۲:**  \n$$\n\\theta = \\tan^{-1}\\left(\\dfrac{3}{4}\\right) = \\tan^{-1}(0.75) \\approx 36.87^\\circ\n$$\n\nچون هم $x$ و هم $y$ مثبت هستند → ربع اول → زاویه همان $36.87^\\circ$ است.\n\n**جواب نهایی:** $(r, \\theta) = (5, 36.87^\\circ)$\n\n### مثال حل‌شده ۲ – از قطبی به دکارتی\n\nنقطه قطبی $r = 13$، $\\theta = 34.26^\\circ$ را به دکارتی تبدیل کن.\n\n**قدم ۱:**  \n$$\nx = 13 \\times \\cos 34.26^\\circ\n$$\n$\\cos 34.26^\\circ \\approx 0.826$ → $x \\approx 13 \\times 0.826 = 10.74$\n\n**قدم ۲:**  \n$$\ny = 13 \\times \\sin 34.26^\\circ\n$$\n$\\sin 34.26^\\circ \\approx 0.563$ → $y \\approx 13 \\times 0.563 = 7.32$\n\n**جواب:** $(x, y) \\approx (10.74, 7.32)$\n\n### مثال حل‌شده ۳ – نقطه در ربع دوم (دام مهم)\n\nنقطه $(-3, 4)$ را به قطبی تبدیل کن.\n\n**قدم ۱:**  \n$$\nr = \\sqrt{(-3)^2 + 4^2} = \\sqrt{9 + 16} = 5\n$$\n\n**قدم ۲:**  \n$$\n\\tan^{-1}\\left(\\dfrac{4}{-3}\\right) = \\tan^{-1}(-1.333) \\approx -53.13^\\circ\n$$\n\nاما چون $x$ منفی و $y$ مثبت است → ربع دوم.  \nپس زاویه واقعی = $180^\\circ - 53.13^\\circ = 126.87^\\circ$\n\n**جواب:** $(r, \\theta) = (5, 126.87^\\circ)$\n\n### هشدار دام تستی\n\n1. فراموش کردن چک کردن ربع → زاویه اشتباه می‌شود.\n2. استفاده از درجه وقتی ماشین‌حساب روی رادیان است (یا برعکس).\n3. منفی کردن زاویه بدون دلیل.\n\n### تمرین من (پلکانی)\n\n**سطح ۱:**  \nنقطه $(0, 5)$ را به قطبی تبدیل کن.\n\n**سطح ۲:**  \nنقطه قطبی $r=10$، $\\theta=120^\\circ$ را به دکارتی بنویس.\n\n**سطح ۳:**  \nنقطه $(-5, -12)$ را به قطبی تبدیل کن (دقت کن ربع سوم است).\n\n**سطح ۴:**  \nنقطه‌ای که $r=8$ و در ربع چهارم با $|\\theta|=30^\\circ$ است را به دکارتی بنویس.\n\n[نیاز به نمودار: صفحه مختصات کامل با چهار ربع، یک نقطه نمونه در هر ربع، خطوط $r$ و $\\theta$ برای یک نقطه، و مؤلفه‌های $x$ و $y$]\n\n---\n"}, {"id": "phys1-session3", "title": "جلسه ۳: نمایش و جمع بردارها", "topics": "جمع هندسی و مؤلفه‌ای", "file": "phys1-session3.md", "markdown": "# جلسه 3\n**۱. نام درس:** فیزیک عمومی ۱  \n**۲. نام مبحث کلان:** بردارها – نمایش و جمع برداری  \n**۳. شماره و عنوان جلسه:** جلسه ۳: نمایش بردار، جمع هندسی و جمع مؤلفه‌ای  \n**۴. برچسب‌ها (Tags):** جمع بردار, قانون متوازی‌الاضلاع, مؤلفه‌های بردار, بردار یکه, جابه‌جایی\n\n**۵. محتوای کامل جلسه (Markdown):**\n\n### پدیده واقعی – چرا جمع ساده کار نمی‌کند؟\n\nفرض کن از خانه‌ات ۱۰ متر به شرق می‌روی، بعد ۱۰ متر به شمال.  \nاگر کسی بپرسد «چقدر از خانه دور شدی؟»  \nاگر بگویی ۲۰ متر، اشتباه است!  \n\nدر واقع تو روی وتر یک مثلث قائم‌الزاویه ایستاده‌ای که اضلاعش ۱۰ و ۱۰ است.  \nفاصله واقعی = $\\sqrt{10^2 + 10^2} = 10\\sqrt{2} \\approx 14.14$ متر.  \n\nاین یعنی جابه‌جایی‌ها را نمی‌شود مثل عددهای معمولی جمع کرد. باید جهت را در نظر گرفت.\n\n### تصویر ذهنی\n\nدو تا پیکان را تصور کن:\n- یکی به سمت راست (شرق)\n- یکی به سمت بالا (شمال)\n\nاگر سر یکی را به دم دیگری بچسبانی، از نقطه شروع تا نقطه پایان یک پیکان جدید کشیده می‌شود. این پیکان جدید همان **برآیند** است.\n\n### توضیح ساده – بردار چیست؟\n\nبردار یک پیکان است که سه ویژگی دارد:\n1. **اندازه** (طول پیکان)\n2. **جهت** (به کدام سمت اشاره می‌کند)\n3. **راستا** (روی کدام خط قرار دارد)\n\nنماد بردار را با یک پیکان کوچک روی حرف نشان می‌دهیم: $\\vec{A}$ یا $\\mathbf{A}$.  \nاندازه بردار را بدون پیکان می‌نویسیم: $A$ یا $|\\vec{A}|$.\n\n### دو روش برای جمع بردارها\n\n**روش ۱ – هندسی (با شکل)**\n\n- روش مثلث (سر به دم): سر بردار اول را به دم بردار دوم بچسبان. از دم اول تا سر دوم را بکش → برآیند.\n- روش متوازی‌الاضلاع: هر دو بردار را از یک نقطه مشترک رسم کن. متوازی‌الاضلاع بساز. قطر آن برآیند است.\n\n**روش ۲ – جبری (با مؤلفه‌ها) – خیلی دقیق‌تر و کاربردی‌تر**\n\nهر بردار را به دو تا قطعه افقی و عمودی می‌شکنیم:\n\n$$\n\\vec{A} = A_x\\,\\hat{i} + A_y\\,\\hat{j}\n$$\n\nکه:\n- $\\hat{i}$ = بردار یکه در جهت مثبت محور $x$ (اندازه‌اش ۱ است)\n- $\\hat{j}$ = بردار یکه در جهت مثبت محور $y$\n\nمؤلفه‌ها چطور پیدا می‌شوند؟\n$$\nA_x = A \\cos\\theta\n$$\n$$\nA_y = A \\sin\\theta\n$$\n\nاندازه کل:\n$$\nA = \\sqrt{A_x^2 + A_y^2}\n$$\n\n### جمع مؤلفه‌ای – قانون طلایی\n\nوقتی چند بردار داری، فقط مؤلفه‌های هم‌جنس را با هم جمع کن:\n\n$$\n\\vec{R} = \\vec{A} + \\vec{B} \\implies\n\\begin{cases}\nR_x = A_x + B_x \\\\\nR_y = A_y + B_y\n\\end{cases}\n$$\n\nبعد اندازه و جهت برآیند را پیدا کن:\n$$\nR = \\sqrt{R_x^2 + R_y^2}\n$$\n$$\n\\theta = \\tan^{-1}\\left(\\dfrac{R_y}{R_x}\\right)\n$$\n\n### مثال حل‌شده ۱ – کشتی و طوفان (از جزوه)\n\n**صورت مسئله:**  \nیک کشتی باید به بندر شمالی در فاصله ۱۲۰ کیلومتر برود. طوفان آن را ۱۰۰ کیلومتر به طرف شرق نقطه شروع می‌برد. این کشتی چه مسافتی و در چه جهتی باید بپیماید تا به مقصد برسد؟\n\n**قدم ۱ – تصویر ذهنی بساز:**  \nمبدأ = نقطه شروع  \nمقصد مطلوب = ۱۲۰ کیلومتر شمال  \nجای فعلی = ۱۰۰ کیلومتر شرق  \n\n**قدم ۲ – بردارها را بنویس:**  \nبردار مطلوب: $\\vec{d}_n = 120\\,\\hat{j}$  \nبردار طوفان: $\\vec{d}_s = 100\\,\\hat{i}$  \n\n**قدم ۳ – برداری که باید برود:**  \n$$\n\\vec{d} = \\vec{d}_n - \\vec{d}_s = -100\\,\\hat{i} + 120\\,\\hat{j}\n$$\n\n**قدم ۴ – اندازه:**  \n$$\n|\\vec{d}| = \\sqrt{(-100)^2 + 120^2} = \\sqrt{10000 + 14400} = \\sqrt{24400} \\approx 156.2\\,\\text{km}\n$$\n\n**قدم ۵ – زاویه:**  \n$$\n\\theta = \\tan^{-1}\\left(\\dfrac{120}{100}\\right) = \\tan^{-1}(1.2) \\approx 50.2^\\circ\n$$\n\nچون $R_x$ منفی و $R_y$ مثبت است → ربع دوم.  \nیعنی ۵۰.۲ درجه شمالِ غرب.\n\n### مثال حل‌شده ۲ – حرکت اتومبیل (از جزوه)\n\nاتومبیلی ۵۰ کیلومتر به شرق، سپس ۳۰ کیلومتر به شمال، سپس ۲۵ کیلومتر با زاویه ۳۰ درجه نسبت به شمال به سمت شمال‌شرقی حرکت می‌کند. جابه‌جایی کل را پیدا کن.\n\n**قدم ۱ – هر بردار را به مؤلفه بشکن:**\n\n$\\vec{A}$ (شرق): $A_x = 50$، $A_y = 0$\n\n$\\vec{B}$ (شمال): $B_x = 0$، $B_y = 30$\n\n$\\vec{C}$ (شمال‌شرقی با زاویه ۳۰ درجه از شمال):  \nزاویه نسبت به محور $x$ مثبت = $90^\\circ - 30^\\circ = 60^\\circ$  \n$$\nC_x = 25 \\cos 60^\\circ = 25 \\times 0.5 = 12.5\n$$\n$$\nC_y = 25 \\sin 60^\\circ = 25 \\times \\dfrac{\\sqrt{3}}{2} \\approx 21.65\n$$\n\n**قدم ۲ – جمع مؤلفه‌ها:**  \n$$\nR_x = 50 + 0 + 12.5 = 62.5\n$$\n$$\nR_y = 0 + 30 + 21.65 = 51.65\n$$\n\n**قدم ۳ – اندازه و زاویه:**  \n$$\nR = \\sqrt{(62.5)^2 + (51.65)^2} \\approx 81.1\\,\\text{km}\n$$\n$$\n\\theta = \\tan^{-1}\\left(\\dfrac{51.65}{62.5}\\right) \\approx 39.6^\\circ\n$$\n(شمال از شرق)\n\n### هشدار دام تستی\n\n1. جمع کردن اندازه‌ها بدون شکستن به مؤلفه.\n2. اشتباه گرفتن زاویه مرجع (از شمال یا از شرق؟).\n3. فراموش کردن علامت منفی وقتی بردار به غرب یا جنوب است.\n\n### تمرین من (پلکانی)\n\n**سطح ۱:**  \nبردار $\\vec{A} = 3\\hat{i} + 4\\hat{j}$ را رسم کن و اندازه‌اش را حساب کن.\n\n**سطح ۲:**  \nدو بردار $\\vec{A} = 5\\hat{i}$ و $\\vec{B} = 12\\hat{j}$ را جمع کن.\n\n**سطح ۳:**  \nشخصی ۳ کیلومتر شمال، سپس ۴ کیلومتر غرب، سپس ۵ کیلومتر جنوب می‌رود. جابه‌جایی کل چقدر و در چه جهتی است؟\n\n**سطح ۴:**  \nکاوشگری باید ۵٫۶ کیلومتر شمال برود اما بعد از بوران متوجه می‌شود ۷٫۸ کیلومتر با زاویه ۵۰ درجه شمالی به طرف شرق رفته. چه مسافتی و در چه جهتی باید برود تا به پایگاه برسد؟\n\n[نیاز به نمودار: سه بردار سر به دم روی صفحه مختصات، بردار برآیند از مبدأ تا نقطه نهایی با زاویه مشخص، و مثلث قائم‌الزاویه برای درک فاصله]\n\n---\n"}, {"id": "phys1-session4", "title": "جلسه ۴: ضرب داخلی دو بردار", "topics": "ضرب داخلی، زاویه، کار", "file": "phys1-session4.md", "markdown": "# جلسه 4\n**۱. نام درس:** فیزیک عمومی ۱  \n**۲. نام مبحث کلان:** بردارها – ضرب داخلی (اسکالر)  \n**۳. شماره و عنوان جلسه:** جلسه ۴: ضرب داخلی دو بردار (Dot Product)  \n**۴. برچسب‌ها (Tags):** ضرب داخلی, Dot Product, زاویه بین بردارها, کار, تصویر\n\n**۵. محتوای کامل جلسه (Markdown):**\n\n### پدیده واقعی – چرا ضرب داخلی لازم است؟\n\nفرض کن می‌خواهی یک جعبه سنگین را روی زمین هل بدهی.  \nاگر نیرو را کاملاً افقی وارد کنی، جعبه خوب حرکت می‌کند.  \nاگر نیرو را کمی به سمت بالا بزنی، بخشی از نیرو هدر می‌رود.  \nاگر نیرو را عمودی به بالا بزنی، جعبه اصلاً روی زمین حرکت نمی‌کند!\n\nفیزیک می‌گوید: «فقط آن قسمت از نیرو که هم‌جهت با جابه‌جایی است، کار انجام می‌دهد.»  \nاین «قسمت هم‌جهت» را با ضرب داخلی حساب می‌کنیم.\n\n### تصویر ذهنی\n\nدو پیکان با زاویه $\\theta$ بینشان.  \nاگر یکی را روی دیگری «تصویر» کنی (مثل سایه خورشید)، طول آن سایه برابر است با $A\\cos\\theta$.  \nبعد این طول سایه را در اندازه بردار دوم ضرب می‌کنی → یک عدد به دست می‌آید.\n\n### تعریف فیزیکی از صفر\n\nضرب داخلی دو بردار $\\vec{A}$ و $\\vec{B}$ این‌گونه تعریف می‌شود:\n\n$$\n\\vec{A} \\cdot \\vec{B} = |\\vec{A}| \\, |\\vec{B}| \\cos\\theta\n$$\n\nکه $\\theta$ زاویه کوچک‌تر بین دو بردار است (بین ۰ تا ۱۸۰ درجه).\n\n**نتیجه همیشه یک عدد اسکالر است** (نه بردار!).\n\n### چه زمانی ضرب داخلی صفر می‌شود؟\n\nاگر دو بردار بر هم عمود باشند ($\\theta = 90^\\circ$)، $\\cos 90^\\circ = 0$، پس ضرب داخلی صفر است.  \nاین یکی از مهم‌ترین کاربردهای ضرب داخلی است: تشخیص عمود بودن.\n\n### محاسبه با مؤلفه‌ها (روش عملی)\n\nاگر بردارها را با مؤلفه نوشته باشی:\n\n$$\n\\vec{A} \\cdot \\vec{B} = A_x B_x + A_y B_y + A_z B_z\n$$\n\nخیلی ساده! فقط مؤلفه‌های هم‌نام را در هم ضرب کن و با هم جمع کن.\n\n### یافتن زاویه بین دو بردار\n\nاز تعریف اصلی می‌توانیم زاویه را پیدا کنیم:\n\n$$\n\\cos\\theta = \\dfrac{\\vec{A} \\cdot \\vec{B}}{|\\vec{A}| \\, |\\vec{B}|}\n$$\n$$\n\\theta = \\cos^{-1}\\left( \\dfrac{\\vec{A} \\cdot \\vec{B}}{|\\vec{A}| \\, |\\vec{B}|} \\right)\n$$\n\n### مثال حل‌شده ۱ – از جزوه\n\nاگر $|\\vec{A}| = 2$، $|\\vec{B}| = 4$ و $\\vec{A} \\cdot \\vec{B} = 3$ باشد، زاویه بین دو بردار را پیدا کن.\n\n**قدم ۱:**  \n$$\n\\cos\\theta = \\dfrac{3}{2 \\times 4} = \\dfrac{3}{8} = 0.375\n$$\n\n**قدم ۲:**  \n$$\n\\theta = \\cos^{-1}(0.375) \\approx 68^\\circ\n$$\n\n### مثال حل‌شده ۲ – با مؤلفه\n\n$\\vec{A} = 3\\hat{i} + 4\\hat{j}$ و $\\vec{B} = 2\\hat{i}$. ضرب داخلی و زاویه را پیدا کن.\n\n**قدم ۱ – ضرب داخلی:**  \n$$\n\\vec{A} \\cdot \\vec{B} = (3)(2) + (4)(0) = 6\n$$\n\n**قدم ۲ – اندازه‌ها:**  \n$$\n|\\vec{A}| = \\sqrt{3^2 + 4^2} = 5\n$$\n$$\n|\\vec{B}| = 2\n$$\n\n**قدم ۳ – زاویه:**  \n$$\n\\cos\\theta = \\dfrac{6}{5 \\times 2} = 0.6 \\implies \\theta = \\cos^{-1}(0.6) \\approx 53.13^\\circ\n$$\n\n### مثال حل‌شده ۳ – شرط عمود بودن\n\n$\\vec{A} = a\\hat{i} + 4\\hat{j} + 3\\hat{k}$ و $\\vec{B} = 2\\hat{i} + a\\hat{j} + 2\\hat{k}$ بر هم عمودند. مقدار $a$ را پیدا کن.\n\nچون عمود هستند، ضرب داخلی باید صفر باشد:\n\n$$\n\\vec{A} \\cdot \\vec{B} = 0\n$$\n$$\n(a)(2) + (4)(a) + (3)(2) = 0\n$$\n$$\n2a + 4a + 6 = 0\n$$\n$$\n6a = -6 \\implies a = -1\n$$\n\n### خواص مهم ضرب داخلی (برای حفظ کردن)\n\n1. جابه‌جایی‌پذیر است: $\\vec{A} \\cdot \\vec{B} = \\vec{B} \\cdot \\vec{A}$\n2. اگر دو بردار موازی و هم‌جهت باشند: $\\vec{A} \\cdot \\vec{B} = |\\vec{A}| |\\vec{B}|$\n3. ضرب یک بردار در خودش: $\\vec{A} \\cdot \\vec{A} = A^2$\n4. اگر یکی از بردارها صفر باشد، حاصل صفر است.\n\n### هشدار دام تستی\n\n1. استفاده از $\\sin$ به جای $\\cos$ → اشتباه رایج.\n2. گذاشتن پیکان روی نتیجه ضرب داخلی (نتیجه اسکالر است!).\n3. فراموش کردن اینکه زاویه بین ۰ تا ۱۸۰ درجه است.\n\n### تمرین من (پلکانی)\n\n**سطح ۱:**  \nاگر دو بردار عمود باشند، ضرب داخلی‌شان چند است؟\n\n**سطح ۲:**  \n$\\vec{A} = 2\\hat{i} + 3\\hat{j}$ و $\\vec{B} = 4\\hat{i} - \\hat{j}$. ضرب داخلی را حساب کن.\n\n**سطح ۳:**  \nزاویه بین $\\vec{a} = 3\\hat{i} + 3\\hat{j} + 3\\hat{k}$ و $\\vec{b} = 2\\hat{i} + \\hat{j} + 3\\hat{k}$ را پیدا کن.\n\n**سطح ۴:**  \nدو بردار $\\vec{A} = 4\\hat{i} + a\\hat{j}$ و $\\vec{B} = a\\hat{i} + 2\\hat{j}$ طوری هستند که ضرب داخلی‌شان برابر ۱۲ است. $a$ را پیدا کن.\n\n[نیاز به نمودار: دو بردار با زاویه $\\theta$، تصویر (سایه) یکی روی دیگری، و نشان دادن $A\\cos\\theta$]\n\n---\n"}, {"id": "phys1-session5", "title": "جلسه ۵: ضرب خارجی دو بردار", "topics": "ضرب خارجی، قاعده دست راست", "file": "phys1-session5.md", "markdown": "# جلسه 5\n**۱. نام درس:** فیزیک عمومی ۱  \n**۲. نام مبحث کلان:** بردارها – ضرب خارجی (برداری)  \n**۳. شماره و عنوان جلسه:** جلسه ۵: ضرب خارجی دو بردار (Cross Product)  \n**۴. برچسب‌ها (Tags):** ضرب خارجی, Cross Product, قانون دست راست, گشتاور, مساحت\n\n**۵. محتوای کامل جلسه (Markdown):**\n\n### پدیده واقعی – گشتاور و چرخش\n\nفرض کن می‌خواهی در را باز کنی.  \nاگر دستت را نزدیک لولا بگذاری و هل بدهی، در سخت باز می‌شود.  \nاگر دستت را دور از لولا بگذاری و هل بدهی، در راحت باز می‌شود.\n\nاین «قدرت چرخاندن» را **گشتاور** می‌گویند.  \nگشتاور هم به اندازه نیرو بستگی دارد، هم به فاصله، هم به زاویه بین نیرو و بازو.  \nو جهت گشتاور عمود بر صفحه است (یا در را ساعت‌گرد می‌چرخاند یا پادساعت‌گرد).\n\nضرب خارجی دقیقاً برای توصیف این‌گونه کمیت‌ها ساخته شده.\n\n### تصویر ذهنی\n\nدو پیکان را در یک صفحه تصور کن.  \nحاصل‌ضرب خارجی آن‌ها یک پیکان جدید است که از صفحه بیرون می‌زند (یا داخل صفحه فرو می‌رود).  \nطول این پیکان جدید برابر مساحت متوازی‌الاضلاعی است که دو بردار اصلی می‌سازند.\n\n### تعریف فیزیکی از صفر\n\n$$\n|\\vec{A} \\times \\vec{B}| = |\\vec{A}| \\, |\\vec{B}| \\sin\\theta\n$$\n\nکه $\\theta$ زاویه کوچک‌تر بین دو بردار است.\n\n**نتیجه همیشه یک بردار است** که عمود بر صفحه شامل $\\vec{A}$ و $\\vec{B}$ قرار دارد.\n\n### قانون دست راست – خیلی مهم\n\nبرای پیدا کردن جهت:\n\n1. انگشتان دست راست را در جهت بردار اول ($\\vec{A}$) قرار بده.\n2. انگشتان را به سمت بردار دوم ($\\vec{B}$) خم کن (کوتاه‌ترین مسیر).\n3. انگشت شست جهت بردار حاصل‌ضرب خارجی را نشان می‌دهد.\n\n### خواص مهم\n\n1. پادجابه‌جایی‌پذیر است: $\\vec{A} \\times \\vec{B} = - (\\vec{B} \\times \\vec{A})$  \n   (اگر جایشان را عوض کنی، جهت برعکس می‌شود)\n\n2. ضرب یک بردار در خودش صفر است: $\\vec{A} \\times \\vec{A} = 0$\n\n3. اگر دو بردار موازی باشند (هم‌جهت یا مخالف‌جهت): $\\vec{A} \\times \\vec{B} = 0$\n\n4. روابط بردارهای یکه (حتماً حفظ کن):\n$$\n\\begin{align*}\n\\hat{i} \\times \\hat{j} &= \\hat{k} \\\\\n\\hat{j} \\times \\hat{k} &= \\hat{i} \\\\\n\\hat{k} \\times \\hat{i} &= \\hat{j} \\\\\n\\hat{j} \\times \\hat{i} &= -\\hat{k} \\\\\n\\hat{k} \\times \\hat{j} &= -\\hat{i} \\\\\n\\hat{i} \\times \\hat{k} &= -\\hat{j}\n\\end{align*}\n$$\n\n### محاسبه با دترمینان (روش استاندارد)\n\n$$\n\\vec{A} \\times \\vec{B} = \\begin{vmatrix}\n\\hat{i} & \\hat{j} & \\hat{k} \\\\\nA_x & A_y & A_z \\\\\nB_x & B_y & B_z\n\\end{vmatrix}\n$$\n\nیعنی:\n$$\n\\vec{A} \\times \\vec{B} = \\hat{i}(A_y B_z - A_z B_y) - \\hat{j}(A_x B_z - A_z B_x) + \\hat{k}(A_x B_y - A_y B_x)\n$$\n\n### مثال حل‌شده ۱ – از جزوه\n\nسه بردار $\\vec{A} = 2\\hat{i} + \\hat{j}$، $\\vec{B} = \\hat{i} + \\hat{k}$، $\\vec{C} = 4\\hat{j}$ داده شده. حاصل $\\vec{A} \\times (\\vec{B} \\times \\vec{C})$ را پیدا کن.\n\n**قدم ۱ – اول داخل پرانتز را حساب کن ($\\vec{B} \\times \\vec{C}$):**\n\n$$\n\\vec{B} \\times \\vec{C} = \\begin{vmatrix}\n\\hat{i} & \\hat{j} & \\hat{k} \\\\\n1 & 0 & 1 \\\\\n0 & 4 & 0\n\\end{vmatrix} = \\hat{i}(0 - 4) - \\hat{j}(0 - 0) + \\hat{k}(4 - 0) = -4\\hat{i} + 4\\hat{k}\n$$\n\n**قدم ۲ – حالا $\\vec{A}$ را در نتیجه ضرب خارجی کن:**\n\n$$\n\\vec{A} \\times (-4\\hat{i} + 4\\hat{k}) = \\begin{vmatrix}\n\\hat{i} & \\hat{j} & \\hat{k} \\\\\n2 & 1 & 0 \\\\\n-4 & 0 & 4\n\\end{vmatrix} = \\hat{i}(4 - 0) - \\hat{j}(8 - 0) + \\hat{k}(0 + 4) = 4\\hat{i} - 8\\hat{j} + 4\\hat{k}\n$$\n\n### کاربرد خیلی مهم – مساحت\n\nمساحت متوازی‌الاضلاع ساخته‌شده توسط دو بردار $\\vec{A}$ و $\\vec{B}$:\n$$\nS = |\\vec{A} \\times \\vec{B}|\n$$\n\nمساحت مثلث ساخته‌شده توسط دو بردار:\n$$\nS_{\\text{مثلث}} = \\dfrac{1}{2} |\\vec{A} \\times \\vec{B}|\n$$\n\n### مثال حل‌شده ۲ – مساحت\n\nمساحت متوازی‌الاضلاع ساخته‌شده توسط $\\vec{A} = 2\\hat{i} + 5\\hat{j} + 4\\hat{k}$ و $\\vec{B} = \\hat{i} + \\hat{j} + \\hat{k}$ را پیدا کن.\n\n$$\n\\vec{A} \\times \\vec{B} = \\begin{vmatrix}\n\\hat{i} & \\hat{j} & \\hat{k} \\\\\n2 & 5 & 4 \\\\\n1 & 1 & 1\n\\end{vmatrix} = \\hat{i}(5-4) - \\hat{j}(2-4) + \\hat{k}(2-5) = \\hat{i} + 2\\hat{j} - 3\\hat{k}\n$$\n\n$$\n|\\vec{A} \\times \\vec{B}| = \\sqrt{1^2 + 2^2 + (-3)^2} = \\sqrt{1+4+9} = \\sqrt{14}\n$$\n\nپس مساحت = $\\sqrt{14}$.\n\n### هشدار دام تستی\n\n1. فراموش کردن علامت منفی در پادجابه‌جایی.\n2. اشتباه در محاسبه دترمینان (علامت وسط را فراموش کردن).\n3. استفاده از $\\cos$ به جای $\\sin$.\n4. فکر کردن که نتیجه اسکالر است.\n\n### تمرین من (پلکانی)\n\n**سطح ۱:**  \n$\\hat{i} \\times \\hat{j}$ برابر چیست؟\n\n**سطح ۲:**  \n$\\vec{A} = 3\\hat{i} + 2\\hat{j}$ و $\\vec{B} = \\hat{i} - 4\\hat{j}$. حاصل $\\vec{A} \\times \\vec{B}$ را پیدا کن (فقط مؤلفه $z$ دارد).\n\n**سطح ۳:**  \nمساحت مثلثی که توسط بردارهای $\\vec{A} = \\hat{i} + 2\\hat{j}$ و $\\vec{B} = 3\\hat{i} - \\hat{j}$ ساخته می‌شود را پیدا کن.\n\n**سطح ۴:**  \nبردار عمود بر هر دو بردار $\\vec{A} = 2\\hat{i} - \\hat{j} + \\hat{k}$ و $\\vec{B} = \\hat{i} + 3\\hat{j} - 2\\hat{k}$ را پیدا کن.\n\n[نیاز به نمودار: دو بردار در صفحه $xy$، متوازی‌الاضلاع، بردار حاصل‌ضرب خارجی عمود بر صفحه به سمت بیرون با نشان دادن قانون دست راست]\n\n---\n"}, {"id": "phys1-session6", "title": "جلسه ۶: کاربردها و مسائل ترکیبی", "topics": "تعادل نیروها، مسائل ترکیبی", "file": "phys1-session6.md", "markdown": "# جلسه 6\n**۱. نام درس:** فیزیک عمومی ۱  \n**۲. نام مبحث کلان:** بردارها – کاربردها و مسائل ترکیبی  \n**۳. شماره و عنوان جلسه:** جلسه ۶: مسائل ترکیبی جمع، ضرب داخلی و خارجی  \n**۴. برچسب‌ها (Tags):** مسائل ترکیبی, تعادل نیروها, مساحت, بردار عمود, تشخیص قانون\n\n**۵. محتوای کامل جلسه (Markdown):**\n\n### پدیده واقعی – انتخاب ابزار درست\n\nدر زندگی واقعی، وقتی با یک مشکل روبه‌رو می‌شوی، اول باید بفهمی از کدام ابزار استفاده کنی.  \nدر فیزیک هم همین‌طور است.  \nسؤال را که می‌خوانی، باید فوری تشخیص بدهی:\n- آیا جمع برداری می‌خواهد؟\n- آیا ضرب داخلی می‌خواهد؟\n- آیا ضرب خارجی می‌خواهد؟\n\nاین جلسه دقیقاً برای تمرین این تشخیص است.\n\n### جدول تشخیص سریع (قانون طلایی)\n\n| ظاهر سؤال | مفهوم | قانون مناسب | دلیل |\n|-----------|-------|-------------|------|\n| برآیند چند نیرو یا جابه‌جایی | جمع | جمع مؤلفه‌ای | نیروها یا جابه‌جایی‌ها با هم جمع می‌شوند |\n| زاویه بین دو بردار | زاویه | ضرب داخلی | فرمول کسینوس |\n| کار انجام‌شده توسط نیرو | کار | ضرب داخلی | فقط مؤلفه هم‌جهت کار می‌کند |\n| گشتاور نیرو | چرخش | ضرب خارجی | گشتاور عمود بر صفحه است |\n| مساحت متوازی‌الاضلاع یا مثلث | مساحت | ضرب خارجی | مساحت = اندازه ضرب خارجی |\n| برداری عمود بر دو خط یا صفحه | عمود | ضرب خارجی | نتیجه عمود بر صفحه است |\n| شرط تعادل چند نیرو | تعادل | جمع برداری = صفر | برآیند باید صفر باشد |\n\n### نکته مهم از جزوه\n\nاگر برآیند چندین بردار صفر باشد و یکی از آن‌ها را حذف کنیم، برآیند بردارهای باقی‌مانده برابر با همان بردار حذف‌شده (با علامت مخالف) می‌شود.\n\n### مثال ترکیبی ۱ – تعادل سه نیرو\n\nبرآیند سه نیروی $3\\,N$، $8\\,N$ و $7\\,N$ صفر است. زاویه بین دو نیروی $8\\,N$ و $7\\,N$ را پیدا کن.\n\nچون برآیند صفر است، این سه نیرو یک مثلث می‌سازند.  \nبا قانون کسینوس:\n\n$$\n3^2 = 8^2 + 7^2 - 2 \\times 8 \\times 7 \\times \\cos\\theta\n$$\n$$\n9 = 64 + 49 - 112\\cos\\theta\n$$\n$$\n9 = 113 - 112\\cos\\theta\n$$\n$$\n112\\cos\\theta = 104 \\implies \\cos\\theta = \\dfrac{104}{112} \\approx 0.929 \\implies \\theta \\approx 21.8^\\circ\n$$\n\n### مثال ترکیبی ۲ – بردار عمود بر دو خط (از جزوه)\n\nسه نقطه $A(1,1,0)$، $B(1,2,0)$، $C(3,0,1)$ داده شده. برداری پیدا کن که بر خطوط $AB$ و $AC$ عمود باشد.\n\n**قدم ۱ – بردارهای جهت را بساز:**  \n$$\n\\vec{AB} = B - A = (1-1, 2-1, 0-0) = (0, 1, 0)\n$$\n$$\n\\vec{AC} = C - A = (3-1, 0-1, 1-0) = (2, -1, 1)\n$$\n\n**قدم ۲ – ضرب خارجی بگیر:**  \n$$\n\\vec{AB} \\times \\vec{AC} = \\begin{vmatrix}\n\\hat{i} & \\hat{j} & \\hat{k} \\\\\n0 & 1 & 0 \\\\\n2 & -1 & 1\n\\end{vmatrix} = \\hat{i}(1 - 0) - \\hat{j}(0 - 0) + \\hat{k}(0 - 2) = \\hat{i} - 2\\hat{k}\n$$\n\nپس بردار $\\hat{i} - 2\\hat{k}$ بر هر دو خط عمود است.\n\n### مثال ترکیبی ۳ – مساحت مثلث و بردار عمود (از جزوه)\n\nنقاط $A(1,1,2)$، $B(2,0,1)$، $C(0,2,1)$. برداری عمود بر صفحه و مساحت مثلث را پیدا کن.\n\n$$\n\\vec{AB} = (1, -1, -1)\n$$\n$$\n\\vec{AC} = (-1, 1, -1)\n$$\n\n$$\n\\vec{N} = \\vec{AB} \\times \\vec{AC} = \\begin{vmatrix}\n\\hat{i} & \\hat{j} & \\hat{k} \\\\\n1 & -1 & -1 \\\\\n-1 & 1 & -1\n\\end{vmatrix} = \\hat{i}(1 - (-1)) - \\hat{j}(-1 - 1) + \\hat{k}(1 - 1) = 2\\hat{i} + 2\\hat{j} + 0\\hat{k}\n$$\n\n$$\n|\\vec{N}| = \\sqrt{4 + 4} = \\sqrt{8} = 2\\sqrt{2}\n$$\n\nمساحت مثلث = $\\dfrac{1}{2} \\times 2\\sqrt{2} = \\sqrt{2}$\n\n### مثال ترکیبی ۴ – دو نیرو با زاویه ۶۰ درجه (از جزوه)\n\nدو نیروی $12\\,N$ و $6\\,N$ با زاویه $60^\\circ$. برآیند را حساب کن و زاویه آن با بردار بزرگ‌تر را پیدا کن.\n\n**قدم ۱ – اندازه برآیند با قانون کسینوس:**  \n$$\nR^2 = 12^2 + 6^2 + 2 \\times 12 \\times 6 \\times \\cos 60^\\circ\n$$\n$$\nR^2 = 144 + 36 + 144 \\times 0.5 = 180 + 72 = 252\n$$\n$$\nR = \\sqrt{252} = 6\\sqrt{7} \\approx 15.87\\,N\n$$\n\n**قدم ۲ – زاویه با بردار بزرگ‌تر (قانون سینوس یا تصویر):**  \n$$\n\\tan\\alpha = \\dfrac{6\\sin 60^\\circ}{12 + 6\\cos 60^\\circ} = \\dfrac{6 \\times \\frac{\\sqrt{3}}{2}}{12 + 6 \\times 0.5} = \\dfrac{3\\sqrt{3}}{15} = \\dfrac{\\sqrt{3}}{5}\n$$\n$$\n\\alpha = \\tan^{-1}\\left(\\dfrac{\\sqrt{3}}{5}\\right) \\approx 19.1^\\circ\n$$\n\n### هشدار دام تستی در مسائل ترکیبی\n\n1. تشخیص اشتباه قانون (مثلاً برای مساحت از ضرب داخلی استفاده کردن).\n2. فراموش کردن علامت در جمع برداری وقتی جهت مخالف است.\n3. در تعادل، فقط اندازه‌ها را صفر کردن به جای بردار برآیند.\n\n### تمرین من (سطح امتحانی)\n\n1. سه نیرو با اندازه‌های ۵، ۱۰ و ۱۵ نیوتون دو به دو زاویه ۱۲۰ درجه می‌سازند. برآیند را پیدا کن.\n2. ثابت کن در هر مثلث $\\dfrac{a}{\\sin A} = \\dfrac{b}{\\sin B} = \\dfrac{c}{\\sin C}$ با استفاده از ضرب خارجی.\n3. شرط هم‌صفحه‌بودن سه بردار $\\vec{A}$، $\\vec{B}$، $\\vec{C}$ را بنویس (یعنی $\\vec{A} \\cdot (\\vec{B} \\times \\vec{C}) = 0$).\n\n[نیاز به نمودار: مثلث نیروها برای حالت تعادل، دو بردار با زاویه ۶۰ درجه و بردار برآیند، صفحه شامل سه نقطه با بردار عمود]\n\n---\n"}, {"id": "phys1-session7", "title": "جلسه ۷: جمع‌بندی و مرور نهایی", "topics": "قوانین و اشتباهات رایج", "file": "phys1-session7.md", "markdown": "# جلسه 7\n**۱. نام درس:** فیزیک عمومی ۱  \n**۲. نام مبحث کلان:** بردارها – جمع‌بندی و جدول‌های نهایی  \n**۳. شماره و عنوان جلسه:** جلسه ۷: جدول قوانین، تشخیص و اشتباهات رایج + مرور نهایی  \n**۴. برچسب‌ها (Tags):** جمع‌بندی, جدول فرمول, اشتباهات رایج, مرور نهایی, خودآزمایی\n\n**۵. محتوای کامل جلسه (Markdown):**\n\n### مرور کامل پدیده تا فرمول (قانون طلایی مهارت)\n\nهر وقت با یک مسئله برداری روبه‌رو شدی، این هفت قدم را طی کن:\n\n1. **پدیده را تصور کن** – در دنیای واقعی چه اتفاقی می‌افتد؟\n2. **تصویر ذهنی بساز** – پیکان‌ها را بکش، زاویه را ببین.\n3. **بپرس نتیجه باید عدد باشد یا بردار؟**\n4. **قانون مناسب را انتخاب کن** (از جدول پایین).\n5. **فرمول را بنویس و تمام نمادها را معنا کن**.\n6. **محاسبه را مرحله‌به‌مرحله انجام بده**.\n7. **جواب را از نظر فیزیکی بررسی کن** (واحد، علامت، بزرگی منطقی است؟).\n\n### جدول کامل قوانین و فرمول‌ها\n\n| مفهوم | فرمول اصلی | چه زمانی استفاده کنم؟ | چه زمانی استفاده نکنم؟ |\n|-------|------------|-----------------------|------------------------|\n| جمع برداری | $R_x = A_x + B_x$ و غیره | یافتن برآیند نیرو یا جابه‌جایی | وقتی فقط اندازه بدون جهت خواسته شده |\n| اندازه بردار | $A = \\sqrt{A_x^2 + A_y^2 + A_z^2}$ | همیشه بعد از یافتن مؤلفه‌ها | — |\n| بردار یکه | $\\hat{A} = \\dfrac{\\vec{A}}{|\\vec{A}|}$ | وقتی فقط جهت مهم است | — |\n| ضرب داخلی | $\\vec{A} \\cdot \\vec{B} = \\|\\vec{A}\\| \\|\\vec{B}\\| \\cos\\theta$ | زاویه، کار، تشخیص عمود بودن | وقتی نتیجه باید بردار باشد |\n| ضرب خارجی | $\\|\\vec{A} \\times \\vec{B}\\| = \\|\\vec{A}\\| \\|\\vec{B}\\| \\sin\\theta$ | گشتاور، مساحت، بردار عمود | وقتی نتیجه باید اسکالر باشد |\n| زاویه از ضرب داخلی | $\\cos\\theta = \\dfrac{\\vec{A} \\cdot \\vec{B}}{\\|\\vec{A}\\| \\|\\vec{B}\\|}$ | یافتن زاویه بین دو بردار | — |\n\n### جدول تشخیص سریع ظاهر سؤال\n\n| ظاهر سؤال | مفهوم احتمالی | قانون مناسب |\n|-----------|---------------|-------------|\n| «برآیند چند نیرو / جابه‌جایی» | جمع | جمع مؤلفه‌ای |\n| «زاویه بین دو بردار» | زاویه | ضرب داخلی |\n| «کار انجام‌شده» | کار | ضرب داخلی |\n| «گشتاور» | چرخش | ضرب خارجی |\n| «مساحت متوازی‌الاضلاع / مثلث» | مساحت | ضرب خارجی |\n| «بردار عمود بر صفحه یا دو خط» | عمود | ضرب خارجی |\n| «شرط تعادل» | تعادل | جمع برداری = صفر |\n| «شرط هم‌صفحه‌بودن» | هم‌صفحه | $\\vec{A} \\cdot (\\vec{B} \\times \\vec{C}) = 0$ |\n\n### جدول اشتباهات رایج و روش جلوگیری\n\n| اشتباه | علت اصلی | روش جلوگیری |\n|--------|----------|-------------|\n| جمع کردن اندازه‌ها بدون جهت | فکر کردن مثل عدد معمولی | همیشه روی نماد پیکان بگذار |\n| استفاده از $\\sin$ در ضرب داخلی | حفظ اشتباه فرمول | داخلی = $\\cos$ ، خارجی = $\\sin$ |\n| فراموش کردن ربع در $\\tan^{-1}$ | اعتماد کامل به ماشین‌حساب | علامت $x$ و $y$ را چک کن |\n| اشتباه در ترتیب دترمینان | عجله | همیشه سطر اول $\\hat{i}\\,\\hat{j}\\,\\hat{k}$ باشد |\n| واحدهای ناسازگار | تبدیل نکردن | قبل از جایگذاری همه را به SI تبدیل کن |\n| گذاشتن پیکان روی نتیجه ضرب داخلی | فراموش کردن اسکالر بودن | نتیجه ضرب داخلی عدد است |\n\n### خودآزمایی نهایی فصل\n\nاین سؤال‌ها را بدون نگاه کردن به جزوه حل کن. اگر گیر کردی، برگرد به جلسه مربوطه.\n\n1. دیمانسیون فشار را بنویس.\n2. نقطه $(-8, 6)$ را به مختصات قطبی تبدیل کن.\n3. دو بردار $\\vec{A} = 3\\hat{i} - 4\\hat{j}$ و $\\vec{B} = -2\\hat{i} + 5\\hat{j}$ را جمع کن و اندازه و جهت برآیند را پیدا کن.\n4. زاویه بین $\\vec{A} = \\hat{i} + 2\\hat{j} + 2\\hat{k}$ و $\\vec{B} = 3\\hat{i} + 6\\hat{j} + 6\\hat{k}$ را پیدا کن. (فکر کن چرا جواب خاص است!)\n5. مساحت مثلث ساخته‌شده توسط $\\vec{A} = 2\\hat{i} + \\hat{j}$ و $\\vec{B} = \\hat{i} - 3\\hat{j}$ را حساب کن.\n6. سه نیرو با اندازه‌های مساوی و زوایای ۱۲۰ درجه نسبت به هم. برآیند چند است؟ چرا؟\n\n### پیام پایانی\n\nبردار را «پیکان دارای اندازه و جهت» ببین، نه فقط سه عدد کنار هم.  \nوقتی پدیده را درست تصور کردی، ریاضی آن تقریباً خودش نوشته می‌شود.  \nهر وقت گیر کردی، برگرد به سؤال اصلی:  \n«در دنیای واقعی چه اتفاقی دارد می‌افتد؟»\n\nموفق باشی.\n\n---\n\n**پایان فصل اول – بردارها**  \nاین نسخه کاملاً خودآموز و از صفر مطلق نوشته شده و آماده تزریق مستقیم به سامانه وب‌سایت Dark Academic با رندر KaTeX است.\n"}];
const STORE='Saves'; let current=0; const $=id=>document.getElementById(id);
function plain(s){return s.replace(/```[\s\S]*?```/g,' ').replace(/[#>*`$|_~\[\]()!-]/g,' ').replace(/\s+/g,' ').trim()}
function render(s){if(window.marked)return marked.parse(s,{gfm:true,breaks:true});return '<pre>'+s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</pre>'}
function makeToc(){let hs=[...$('article').querySelectorAll('h2,h3')];$('toc').innerHTML=hs.map((h,i)=>{h.id='section-'+i;return '<a class="'+(h.tagName==='H3'?'sub':'')+'" href="#section-'+i+'">'+h.textContent+'</a>'}).join('')||'—'}
function openSession(i,save=true){if(i<0||i>=COURSES.length)return;current=i;let s=COURSES[i];$('article').innerHTML=s.markdown?render(s.markdown):'<h2>'+s.title+'</h2><p>محتوای جلسه موجود نیست. فایل جلسه را در ریشه یا پوشه physics1_sessions قرار دهید.</p>';document.title=s.title+' | فیزیک عمومی ۱';document.querySelectorAll('.session').forEach((b,n)=>b.classList.toggle('active',n===i));makeToc();if(window.renderMathInElement)renderMathInElement($('article'),{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],throwOnError:false});if(save)localStorage.setItem(STORE,s.id);$('side').classList.remove('open');$('scrim').classList.remove('show');window.scrollTo(0,0)}
$('nav').innerHTML=COURSES.map((s,i)=>'<button class="session" data-i="'+i+'">'+s.title+'</button>').join('');document.querySelectorAll('.session').forEach(b=>b.onclick=()=>openSession(+b.dataset.i));let last=COURSES.findIndex(s=>s.id===localStorage.getItem(STORE));if(last>=0){$('banner').style.display='block';$('resume').onclick=()=>{$('banner').style.display='none';openSession(last)}}openSession(0,false);
$('prev').onclick=()=>openSession(Math.max(0,current-1));$('next').onclick=()=>openSession(Math.min(COURSES.length-1,current+1));function font(d){let n=Math.max(14,Math.min(28,+(localStorage.getItem('contentSize')||18)+d));localStorage.setItem('contentSize',n);document.documentElement.style.setProperty('--content-font-size',n+'px')}document.documentElement.style.setProperty('--content-font-size',(localStorage.getItem('contentSize')||18)+'px');$('plus').onclick=()=>font(1);$('minus').onclick=()=>font(-1);$('reset').onclick=()=>{localStorage.setItem('contentSize',18);document.documentElement.style.setProperty('--content-font-size','18px')};
function setTheme(t){document.documentElement.classList.toggle('light',t==='light');localStorage.setItem('theme',t);$('theme').textContent=t==='light'?'☾':'☼'}setTheme(localStorage.getItem('theme')||'dark');$('theme').onclick=()=>setTheme(document.documentElement.classList.contains('light')?'dark':'light');
$('share').onclick=async()=>{let url=location.href.split('#')[0]+'#'+COURSES[current].id;try{if(navigator.share)await navigator.share({title:COURSES[current].title,url});else{await navigator.clipboard.writeText(url);alert('پیوند جلسه کپی شد')}}catch(e){try{await navigator.clipboard.writeText(url)}catch(_){prompt('پیوند جلسه را کپی کنید:',url)}}};
$('q').oninput=()=>{let q=$('q').value.trim().toLocaleLowerCase('fa'),r=$('results');if(!q){r.style.display='none';return}let hits=COURSES.map((s,i)=>({s,i,all:(s.title+' '+s.topics+' '+s.markdown).toLocaleLowerCase('fa')})).filter(x=>x.all.includes(q));r.innerHTML=hits.length?hits.map(x=>'<button data-i="'+x.i+'">'+x.s.title+'<small style="display:block;color:var(--muted)">'+plain(x.s.markdown).slice(0,160)+'</small></button>').join(''):'<div style="padding:12px">نتیجه‌ای پیدا نشد.</div>';r.style.display='block';r.querySelectorAll('button').forEach(b=>b.onclick=()=>{openSession(+b.dataset.i);r.style.display='none';$('q').value=''})};
$('hamb').onclick=()=>{$('side').classList.add('open');$('scrim').classList.add('show')};$('scrim').onclick=()=>{$('side').classList.remove('open');$('scrim').classList.remove('show')};document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();$('q').focus()}if(e.key==='Escape'){$('q').blur();$('q').value='';$('results').style.display='none';$('side').classList.remove('open');$('scrim').classList.remove('show')}if(e.altKey&&e.key.toLowerCase()==='n'){e.preventDefault();openSession(Math.min(COURSES.length-1,current+1))}if(e.altKey&&e.key.toLowerCase()==='p'){e.preventDefault();openSession(Math.max(0,current-1))}});
