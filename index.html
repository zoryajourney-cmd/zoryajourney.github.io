<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZoryaJourney | سامانه مدیریت دروس</title>

  <!-- فونت Vazirmatn -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600;700;900&display=swap" rel="stylesheet">

  <!-- کتابخانه‌های پردازش فرمول KaTeX و Marked -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --bg-main: #0B0E17;
      --bg-card: rgba(19, 24, 38, 0.75);
      --bg-sidebar: #0f1322;
      --accent-purple: #8B5CF6;
      --accent-cyan: #06B6D4;
      --accent-pink: #EC4899;
      --border-glow: rgba(139, 92, 246, 0.25);
      --text-main: #E2E8F0;
      --text-muted: #94A3B8;
      --code-bg: #161B2E;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Vazirmatn', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* سایدبار */
    aside {
      width: 320px;
      background: var(--bg-sidebar);
      border-left: 1px solid var(--border-glow);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      padding: 1.2rem;
      gap: 1.2rem;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 900;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .search-box input {
      width: 100%;
      background: var(--code-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 0.6rem 0.8rem;
      color: #fff;
      font-family: inherit;
      outline: none;
      transition: border 0.2s;
    }
    .search-box input:focus {
      border-color: var(--accent-cyan);
    }

    .tree-nav {
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .course-group {
      margin-bottom: 0.6rem;
    }

    .course-title {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--accent-cyan);
      padding: 0.3rem 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      margin-bottom: 0.4rem;
    }

    .topic-title {
      font-size: 0.8rem;
      color: var(--accent-pink);
      padding: 0.2rem 0.5rem;
      font-weight: 600;
    }

    .nav-item {
      padding: 0.45rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 0.9rem;
      transition: all 0.2s;
      margin-right: 0.5rem;
    }
    .nav-item:hover, .nav-item.active {
      background: rgba(139, 92, 246, 0.15);
      color: #fff;
      border-right: 3px solid var(--accent-purple);
    }

    /* محتوای اصلی */
    main {
      flex: 1;
      overflow-y: auto;
      padding: 2.5rem 3.5rem;
      position: relative;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      padding-bottom: 1rem;
    }

    .tags {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .tag {
      background: rgba(6, 182, 212, 0.15);
      color: var(--accent-cyan);
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      font-size: 0.8rem;
    }

    .action-btn {
      background: var(--code-bg);
      border: 1px solid var(--border-glow);
      color: var(--text-main);
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.85rem;
      transition: 0.2s;
    }
    .action-btn:hover {
      background: var(--accent-purple);
      color: white;
    }

    /* صفحه داشبورد خانه */
    .dashboard-title {
      font-size: 2rem;
      font-weight: 900;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #fff, var(--accent-cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .dashboard-subtitle {
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-top: 1.5rem;
    }

    .course-card {
      background: var(--bg-card);
      border: 1px solid var(--border-glow);
      border-radius: 12px;
      padding: 1.5rem;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
    }
    .course-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent-cyan);
      box-shadow: 0 8px 25px rgba(6, 182, 212, 0.15);
    }
    .course-card h3 {
      font-size: 1.3rem;
      color: #fff;
      margin-bottom: 0.5rem;
    }
    .course-card p {
      color: var(--text-muted);
      font-size: 0.9rem;
      line-height: 1.5;
    }
    .course-card .badge {
      display: inline-block;
      margin-top: 1rem;
      background: rgba(139, 92, 246, 0.2);
      color: var(--accent-purple);
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    /* استایل‌های رندر مارک‌داون */
    .article-body {
      max-width: 880px;
      line-height: 1.9;
      font-size: 1.05rem;
    }
    .article-body h1 {
      font-size: 2.2rem;
      color: #fff;
      margin-bottom: 1.2rem;
      border-bottom: 2px solid var(--accent-purple);
      display: inline-block;
      padding-bottom: 0.3rem;
    }
    .article-body h2 {
      font-size: 1.5rem;
      color: var(--accent-cyan);
      margin: 2rem 0 1rem;
    }
    .article-body h3 {
      font-size: 1.2rem;
      color: var(--accent-pink);
      margin: 1.2rem 0 0.6rem;
    }
    .article-body p { margin-bottom: 1.2rem; }

    .note-box {
      background: rgba(139, 92, 246, 0.08);
      border-right: 4px solid var(--accent-purple);
      padding: 1.2rem;
      border-radius: 0 8px 8px 0;
      margin: 1.5rem 0;
    }
    .example-box {
      background: rgba(6, 182, 212, 0.08);
      border-right: 4px solid var(--accent-cyan);
      padding: 1.2rem;
      border-radius: 0 8px 8px 0;
      margin: 1.5rem 0;
    }

    /* ریاضی KaTeX */
    .katex-display {
      direction: ltr !important;
      margin: 1.2rem 0 !important;
    }
    .katex {
      direction: ltr !important;
      font-size: 1.15em;
    }

    @media print {
      aside, .header-bar { display: none; }
      body { background: white; color: black; }
      main { padding: 0; }
    }
  </style>
</head>
<body>

  <!-- سایدبار -->
  <aside>
    <div class="brand" onclick="showDashboard()">
      <span>✨ ZoryaJourney</span>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="جست‌وجو در تمام جلسات..." oninput="filterSessions()">
    </div>
    <div class="tree-nav" id="treeNav"></div>
  </aside>

  <!-- محتوای اصلی -->
  <main id="mainContainer">
    <div class="header-bar" id="headerBar" style="display: none;">
      <div class="tags" id="sessionTags"></div>
      <div style="display: flex; gap: 0.5rem;">
        <button class="action-btn" onclick="showDashboard()">🏠 صفحه اصلی</button>
        <button class="action-btn" onclick="window.print()">🖨️ خروجی PDF</button>
        <button class="action-btn" onclick="copyShareLink()">🔗 اشتراک‌گذاری</button>
      </div>
    </div>

    <div id="viewArea"></div>
  </main>

  <script>
    // پایگاه داده دروس
    const database = [
      {
        courseId: "math1",
        courseName: "ریاضی عمومی ۱",
        description: "حساب دیفرانسیل و انتگرال، حد، مشتق، پیوستگی و سری‌ها",
        topics: [
          {
            topicName: "حد و پیوستگی",
            sessions: [
              {
                id: "math1-limits-intro",
                title: "جلسه ۱: مفهوم شهودی و تعریف دقیق حد",
                tags: ["ریاضی ۱", "حد", "پیوستگی"],
                markdown: `# مفهوم حد (Limit)

حد یکی از بنیادین‌ترین ابزارهای ریاضی عمومی و حساب دیفرانسیل است که رفتار یک تابع را زمانی که متغیر به یک مقدار خاص نزدیک می‌شود، بررسی می‌کند.

## تعریف شهودی حد
می‌گوییم حد تابع $f(x)$ وقتی $x$ به $a$ نزدیک می‌شود برابر با $L$ است:

$$ \\lim_{x \\to a} f(x) = L $$

اگر بتوانیم مقادیر $f(x)$ را با نزدیک کردن کافی $x$ به $a$، به اندازه دلخواه به $L$ نزدیک کنیم.

<div class="note-box">
💡 **نکته کلیدی:** مقدار حد در نقطه $x = a$ هیچ ارتباطی با مقدار خود تابع در آن نقطه یعنی $f(a)$ ندارد! حتی ممکن است تابع در آن نقطه تعریف نشده باشد.
</div>

## مثال کاربردی
تابع کسری زیر را در نظر بگیرید:

$$ f(x) = \\frac{x^2 - 1}{x - 1} $$

این تابع در نقطه $x = 1$ تعریف‌نشده است (مخرج صفر می‌شود). اما برای محاسبه حد:

$$ \\lim_{x \\to 1} \\frac{(x - 1)(x + 1)}{x - 1} = \\lim_{x \\to 1} (x + 1) = 2 $$

<div class="example-box">
📌 **نتیجه:** با اینکه تابع در $x=1$ تعریف نشده، اما حد آن برابر با **۲** است.
</div>`
              }
            ]
          }
        ]
      },
      {
        courseId: "physics1",
        courseName: "فیزیک دانشگاهی ۱",
        description: "مکانیک کلاسیک، حرکت‌شناسی، قوانین نیوتون، کار و انرژی",
        topics: [
          {
            topicName: "حرکت‌شناسی (سینماتیک)",
            sessions: [
              {
                id: "phys1-kinematics",
                title: "جلسه ۱: بردار مکان و سرعت لحظه‌ای",
                tags: ["فیزیک ۱", "سینماتیک", "بردار"],
                markdown: `# بردار مکان و سرعت لحظه‌ای

در مکانیک کلاسیک، توصیف دقیق حرکت بدون در نظر گرفتن نیروها با سینماتیک انجام می‌شود.

## بردار مکان
موقعیت ذره در فضا با بردار مکان $\\vec{r}(t)$ مشخص می‌شود:
$$ \\vec{r}(t) = x(t)\\hat{i} + y(t)\\hat{j} + z(t)\\hat{k} $$

## سرعت لحظه‌ای
سرعت لحظه‌ای مشتق بردار مکان نسبت به زمان است:
$$ \\vec{v}(t) = \\frac{d\\vec{r}}{dt} $$`
              }
            ]
          }
        ]
      }
    ];

    // نمایش صفحه اصلی (داشبورد کارت‌ها)
    function showDashboard() {
      document.getElementById('headerBar').style.display = 'none';
      const viewArea = document.getElementById('viewArea');
      
      let html = `
        <div class="dashboard-title">📚 مرکز یادگیری ZoryaJourney</div>
        <div class="dashboard-subtitle">سامانه یکپارچه جزوات، فرمول‌ها و مباحث تحلیلی دانشگاه</div>
        <div class="cards-grid">
      `;

      database.forEach(course => {
        let totalSessions = 0;
        course.topics.forEach(t => totalSessions += t.sessions.length);

        html += `
          <div class="course-card" onclick="openFirstSessionOfCourse('${course.courseId}')">
            <h3>${course.courseName}</h3>
            <p>${course.description}</p>
            <span class="badge">📖 ${totalSessions} جلسه ثبت‌شده</span>
          </div>
        `;
      });

      html += `</div>`;
      viewArea.innerHTML = html;
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
    }

    function openFirstSessionOfCourse(courseId) {
      const course = database.find(c => c.courseId === courseId);
      if (course && course.topics.length > 0 && course.topics[0].sessions.length > 0) {
        loadSession(course.topics[0].sessions[0]);
      }
    }

    function renderTree() {
      const treeNav = document.getElementById('treeNav');
      treeNav.innerHTML = '';

      database.forEach(course => {
        const group = document.createElement('div');
        group.className = 'course-group';

        const cTitle = document.createElement('div');
        cTitle.className = 'course-title';
        cTitle.innerText = '📁 ' + course.courseName;
        group.appendChild(cTitle);

        course.topics.forEach(topic => {
          const tTitle = document.createElement('div');
          tTitle.className = 'topic-title';
          tTitle.innerText = '▫️ ' + topic.topicName;
          group.appendChild(tTitle);

          topic.sessions.forEach(session => {
            const sItem = document.createElement('div');
            sItem.className = 'nav-item';
            sItem.id = `nav-${session.id}`;
            sItem.innerText = session.title;
            sItem.onclick = () => loadSession(session);
            group.appendChild(sItem);
          });
        });

        treeNav.appendChild(group);
      });
    }

    function loadSession(session) {
      document.getElementById('headerBar').style.display = 'flex';
      const viewArea = document.getElementById('viewArea');
      
      viewArea.innerHTML = `<article class="article-body">${marked.parse(session.markdown)}</article>`;

      renderMathInElement(viewArea, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false}
        ],
        throwOnError: false
      });

      const tagsContainer = document.getElementById('sessionTags');
      tagsContainer.innerHTML = session.tags.map(t => `<span class="tag">${t}</span>`).join('');

      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById(`nav-${session.id}`);
      if (activeEl) activeEl.classList.add('active');
    }

    function copyShareLink() {
      navigator.clipboard.writeText(window.location.href);
      alert('لینک صفحه با موفقیت کپی شد!');
    }

    function filterSessions() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      document.querySelectorAll('.nav-item').forEach(el => {
        el.style.display = el.innerText.toLowerCase().includes(q) ? 'block' : 'none';
      });
    }

    renderTree();
    showDashboard();
  </script>
</body>
</html>
